[project]
name = "signalpost"
version = "1.0.0"
description = "Signalpost agent: Norwegian company profiles from public registers, with sources and dates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
signalpost = "signalpost.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
